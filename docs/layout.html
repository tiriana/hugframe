<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="API reference for hugframe: an iframe that hugs its content, then morphs into a chromeless full-window view."
    />
    <title>{{title}}</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      {{styles}}
    </style>
  </head>
  <body>
    <header class="site">
      <div class="site__inner">
        <a class="site__brand" href="../">hugframe</a>
        <a class="site__link" href="https://www.npmjs.com/package/hugframe">npm</a>
      </div>
    </header>
    <main class="page">{{content}}</main>
  </body>
</html>
