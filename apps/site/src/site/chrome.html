<!-- The one copy of the site header and footer. The demo mounts it through a Vite ?raw
     import, and scripts/build-docs.mjs inlines it into the API page. The {{home}}, {{api}}
     and {{*-current}} tokens are the only parts that differ between the two pages; nothing
     else here is templated. The footer is split off at the marker comment below. -->
<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__brand" href="{{home}}">hugframe</a>
    <nav class="masthead__nav" aria-label="Site sections">
      <a href="{{home}}" {{demo-current}}>Demo</a>
      <a href="{{home}}playground/">Playground</a>
      <a href="{{api}}" {{api-current}}>API reference</a>
    </nav>
    <div class="masthead__util">
      <a
        class="masthead__github"
        href="https://github.com/tiriana/hugframe"
        aria-label="hugframe on GitHub"
        title="hugframe on GitHub"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          viewBox="0 0 16 16"
          width="18"
          height="18"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"
          />
        </svg>
      </a>
      <a
        class="masthead__npm"
        href="https://www.npmjs.com/package/hugframe"
        aria-label="hugframe on npm"
        title="hugframe on npm"
        target="_blank"
        rel="noopener noreferrer"
      >
        npm
      </a>
    </div>
  </div>
</header>

<!-- site:footer -->
<footer class="footer">
  <div class="footer__inner">
    <p class="footer__note">An iframe that fits its content, then opens into the whole window.</p>
    <nav class="footer__nav" aria-label="Project links">
      <a href="{{home}}">Demo</a>
      <a href="{{home}}playground/">Playground</a>
      <a href="{{api}}">API reference</a>
      <a href="https://github.com/tiriana/hugframe" target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
      <a href="https://www.npmjs.com/package/hugframe" target="_blank" rel="noopener noreferrer">
        npm
      </a>
    </nav>
  </div>
</footer>
