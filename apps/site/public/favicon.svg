<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>hugframe</title>
  <style>
    .plate {
      fill: #4b46e0;
    }
    .mark {
      stroke: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      .plate {
        fill: #9b94ff;
      }
      .mark {
        stroke: #12131a;
      }
    }
  </style>
  <!-- The presentation attributes repeat the light values so the mark survives a renderer
       that ignores the stylesheet; the rules above only add the dark override. -->
  <rect class="plate" width="32" height="32" rx="7" fill="#4b46e0" />
  <path
    class="mark"
    d="M20.5 11.5H26V6L19.5 12.5M11.5 20.5H6V26L12.5 19.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
