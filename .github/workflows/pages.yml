name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:pages

      # The preview workflow publishes per-PR previews into the same branch, so this
      # deploy rebases onto what is already there and keeps its umbrella directory,
      # rather than force-pushing a tree that does not contain either.
      - name: Publish to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/site/.pages
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false
