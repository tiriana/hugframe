name: PR preview

# The same build the Pages workflow publishes, deployed one directory deeper so each
# pull request gets its own copy. The preview action removes it again when the PR closes.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token, so it could neither publish a
    # preview nor remove one; the alternative trigger would run fork code with write
    # access, which is the trade the preview action declines to make.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      HUSKY: '0'
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # The preview is served under the deployment's own /hugframe/ prefix plus the
      # umbrella directory and the PR number, so the asset URLs have to be built for
      # that path rather than for the deployment root.
      - name: Build the site for the preview path
        if: github.event.action != 'closed'
        env:
          GF_BASE_PATH: /hugframe/pr-preview/pr-${{ github.event.number }}/
        run: npm run build:pages

      # `action` is left at its default, which deploys on every event but `closed` and
      # removes the preview directory on `closed`.
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/site/.pages
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          qr-code: false
