name: Verify published versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release workflow dispatches each publish and returns without waiting,
      # so a version can be recorded in the manifest yet never reach the registry.
      - name: Verify every released version is on the registry
        run: node scripts/verify-published.mjs
