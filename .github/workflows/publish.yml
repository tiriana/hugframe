name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example hugframe-v2.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      HUSKY: '0'
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # npm requires the package manager cache to stay off for the OIDC
          # exchange that trusted publishing performs.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve the package the tag names
        id: target
        run: echo "path=$(node scripts/release-target.mjs '${{ inputs.tag }}')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build -w "${{ steps.target.outputs.path }}"

      - name: Test
        run: npm test -w "${{ steps.target.outputs.path }}"

      # Publishing a version that already exists fails the run, so a re-run of
      # a failed publish after a successful one is a no-op rather than an error.
      - name: Check whether this version is already published
        id: published
        working-directory: ${{ steps.target.outputs.path }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already published, so the publish step is skipped."
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        working-directory: ${{ steps.target.outputs.path }}
        # --access public only changes behaviour for scoped names.
        run: npm publish --access public
