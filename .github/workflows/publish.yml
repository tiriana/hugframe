name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      HUSKY: '0'
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # npm requires the package manager cache to stay off for the OIDC
          # exchange that trusted publishing performs.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version from the release tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Publish
        # --access public only changes behaviour for scoped names.
        run: npm publish --access public
