name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      HUSKY: '0'
      # The release event carries the tag; a manual dispatch passes it in.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # npm requires the package manager cache to stay off for the OIDC
          # exchange that trusted publishing performs.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version from the release tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      # Publishing a version that already exists fails the run, so a re-run of
      # a failed publish after a successful one is a no-op rather than an error.
      - name: Check whether this version is already published
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${TAG#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${TAG#v} is already published, so the publish step is skipped."
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        # --access public only changes behaviour for scoped names.
        run: npm publish --access public
