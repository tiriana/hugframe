name: Release

on:
  push:
    branches:
      - main

permissions:
  # release-please opens the Release PR and creates the tags and releases through
  # the API; the publish workflow is dispatched explicitly at the end of this job.
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # release-please walks the full history to find the last release.
          fetch-depth: 0
          # The Release PR, the tags and the releases are all created through the
          # API, so the workflow does not need git credentials left behind.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A pull request opened with GITHUB_TOKEN has its pull_request runs held for approval.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Falls back to GITHUB_TOKEN until the App is configured.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release created with the default GITHUB_TOKEN does not trigger the
      # `release: published` event, and npm trusted publishing is bound to the
      # publish workflow by filename, so each released tag is dispatched here.
      - name: Publish the released packages
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          node scripts/released-tags.mjs | while read -r tag; do
            echo "::notice::dispatching the publish workflow for ${tag}"
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --field "tag=${tag}"
          done

      # The dispatch above returns as soon as the publish workflow is queued, so
      # this waits for the released versions to actually reach the registry and
      # fails the release run if they never do.
      - name: Verify the released versions reached the registry
        if: steps.release.outputs.releases_created == 'true'
        run: node scripts/verify-published.mjs --wait 300

      # Putting the release PR into auto-merge lets a merged release land without a click.
      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(echo "$PR" | jq -r '.number')
          if [ "$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest')" != 'null' ]; then
            echo "auto-merge already enabled on #${number}"
            exit 0
          fi
          gh pr merge "$number" --squash --auto
